server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy al API. Sin esto `location /` capturaba /api/* y devolvía
  # index.html (fallback SPA): el cliente recibía 200 text/html donde
  # esperaba JSON, y toda llamada al backend fallaba en silencio.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (/api/conversacion/stream): sin buffering ni timeout corto,
    # o los tokens llegan de golpe al cerrar la respuesta.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }

  # El service worker y el manifest NUNCA se cachean inmutable: con
  # `expires 30d` el navegador no detectaría actualizaciones de la PWA.
  # (El `location =` exacto tiene prioridad sobre el regex de abajo.)
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    expires off;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
