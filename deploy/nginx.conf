server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # El service worker y el manifest NUNCA se cachean inmutable: con
  # `expires 30d` el navegador no detectaría actualizaciones de la PWA.
  # (El `location =` exacto tiene prioridad sobre el regex de abajo.)
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    expires off;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
