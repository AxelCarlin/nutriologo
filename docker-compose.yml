services:
  postgres:
    image: postgres:17
    container_name: nutriologo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Buss1ness.2026
      POSTGRES_DB: nutriologo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutriologo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
